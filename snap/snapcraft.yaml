name: neofetch-desktop
base: core24
adopt-info: neofetch-desktop
summary: Neofetch Desktop
description: |
  Shows Linux System Information with Distribution Logo
icon: data/neofetch-desktop.png
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

parts:
  hyfetch:
    # hyfetch >= 2.0 is a Rust (Cargo) rewrite; the pre-2.0 releases were
    # Python/Make-based and provided a "neofetch" binary, whereas this
    # produces a "hyfetch" binary instead (see neofetch-desktop part below
    # and src/neofetch-desktop.c for the corresponding command update).
    plugin: rust
    source: https://github.com/hykilpikonna/hyfetch.git
    source-tag: '2.0.5'
    # The gnome extension injects an LD_LIBRARY_PATH pointing into the
    # gnome-46-2404-sdk snap for every part. The classically-confined
    # rustup build-snap's binary is incompatible with that SDK's glibc
    # (it crashes with a "symbol lookup error"/undefined GLIBC_PRIVATE
    # symbol), which craft-parts then misreports as "'rustup' not found".
    # Reset LD_LIBRARY_PATH (not needed to build hyfetch) and make sure
    # /snap/bin (where rustup lives) is on PATH.
    build-environment:
      - PATH: /snap/bin:$PATH
      - LD_LIBRARY_PATH: ""
    organize:
      hyfetch: usr/bin/hyfetch
    stage-packages:
      - bind9-dnsutils
      - pciutils
    prime:
      - usr/bin/hyfetch
      - usr/lib/*/libpci.so*
      - usr/lib/*/libbind9*.so
      - usr/lib/*/libdns-9*.so
      - usr/lib/*/libirs-9*.so
      - usr/lib/*/libisc-9*.so
      - usr/lib/*/libisccfg-9*.so
      - usr/lib/*/liblmdb.so.*
      - usr/lib/*/libmaxminddb.so.*
      - usr/lib/*/libns-9*.so

  vte:
    source: https://gitlab.gnome.org/GNOME/vte.git
    source-tag: '0.72.1'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Dgir=false
      - -Da11y=false
      - -Dicu=false
      - -Ddocs=false
      - -Dglade=false
      - -Dgnutls=true
      - -Dfribidi=false
      - -Dgtk3=false
      - -Dgtk4=true
      - -D_systemd=false
      - -Dvapi=false
    override-pull: |
      craftctl default
      sed -i 's#error=format#format#' meson.build
    prime:
      - usr/lib/*/libvte*gtk4.so.*
      
  neofetch-desktop:
    after: [ vte ]
    plugin: meson
    source: .
    meson-parameters:
      - --prefix=/usr
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=10)
    prime:
      - usr/bin/neofetch-desktop
      - usr/share/applications/neofetch-desktop.desktop
      - usr/share/icons
      - usr/share/neofetch-desktop

  # Find files provided by the base and platform snap and ensure they aren't duplicated in this snap
  cleanup:
    after: [hyfetch, neofetch-desktop]
    plugin: nil
    build-snaps: [core24, gtk-common-themes, gnome-46-2404]
    override-prime: |
      set -eux
      for snap in "core24" "gtk-common-themes" "gnome-46-2404"; do
        cd "/snap/$snap/current" && find . -type f,l -name *.so.* -exec rm -f "$CRAFT_PRIME/{}" \;
      done

apps:
  neofetch-desktop:
    extensions: [ gnome ]
    command: usr/bin/neofetch-desktop
    desktop: usr/share/applications/neofetch-desktop.desktop
    plugs:
      - hardware-observe
      - system-observe
      - network
